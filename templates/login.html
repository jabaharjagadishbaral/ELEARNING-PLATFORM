{% extends "base.html" %}
{% block title %}Log in — EduSphere{% endblock %}
{% block content %}
<section class="auth-form">
    <h1>Welcome back</h1>
    <form method="POST">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="muted">New here? <a href="{{ url_for('main.register') }}">Create an account</a></p>
</section>
{% endblock %}
